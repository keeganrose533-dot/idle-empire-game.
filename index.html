<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cyber Clash: Infinite Xtreme</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">

  <header id="header" class="panel hero-panel">
    <div>
      <p class="eyebrow">Autonomous empire simulator</p>
      <h1>Cyber Clash</h1>
    </div>
    <div id="xp-bar" aria-label="Experience progress">
      <div id="xp-fill"></div>
      <span id="xp-text">XP: 0 / 100</span>
    </div>
    <div id="resource-grid">
      <div class="resource-card"><span>Energy</span><strong id="energy-display">0</strong></div>
      <div class="resource-card"><span>Credits</span><strong id="credits-display">0</strong></div>
      <div class="resource-card"><span>Level</span><strong id="level-display">1</strong></div>
      <div class="resource-card"><span>Heat</span><strong id="heat-display">0%</strong></div>
      <div class="resource-card"><span>Stability</span><strong id="stability-display">100%</strong></div>
      <div class="resource-card"><span>Rebirth / Prestige</span><strong id="ascension-display">0 / 0</strong></div>
    </div>
  </header>

  <main>
    <section id="core-container" class="panel core-panel">
      <button id="click-core" type="button">
        <span>PULSE CORE</span>
        <small id="pulse-gain">+1 energy</small>
      </button>
      <div class="core-readouts">
        <span id="energy-rate">+0/s energy</span>
        <span id="credit-rate">+0/s credits</span>
        <span id="bot-pressure">500 rivals online</span>
      </div>
    </section>

    <nav id="tabs" aria-label="Game systems">
      <button class="tab-btn active" data-tab="upgrades" type="button">Upgrades</button>
      <button class="tab-btn" data-tab="research" type="button">Research</button>
      <button class="tab-btn" data-tab="operations" type="button">Operations</button>
      <button class="tab-btn" data-tab="factions" type="button">Factions</button>
      <button class="tab-btn" data-tab="leaderboard" type="button">Leaderboard</button>
      <button class="tab-btn" data-tab="stats" type="button">Stats</button>
      <button class="tab-btn" data-tab="achievements" type="button">Achievements</button>
    </nav>

    <section id="tab-contents" class="panel">
      <div id="upgrades" class="tab-content active"></div>
      <div id="research" class="tab-content"></div>
      <div id="operations" class="tab-content"></div>
      <div id="factions" class="tab-content"></div>
      <div id="leaderboard" class="tab-content"></div>
      <div id="stats" class="tab-content"></div>
      <div id="achievements" class="tab-content"></div>
    </section>

    <aside id="event-console" class="panel">
      <div class="console-header">
        <h2>Neural Event Console</h2>
        <button id="reset-save" type="button">Reset simulation</button>
      </div>
      <ol id="event-log"></ol>
    </aside>
  </main>

</div>
<script src="script.js"></script>
</body>
</html>
